# ============================================
# 一键启动全部服务: docker compose up -d
# 停止: docker compose down
# ============================================

services:

  # ---- MySQL 数据库 ----
  mysql:
    image: mysql:8.0
    container_name: campus-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: campus_canteen
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis 缓存 ----
  redis:
    image: redis:7-alpine
    container_name: campus-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---- RabbitMQ 消息队列 ----
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: campus-rabbitmq
    restart: always
    ports:
      - "5672:5672"    # 应用连接端口
      - "15672:15672"  # 管理控制台（浏览器访问）
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Spring Boot 应用 ----
  app:
    build: .
    container_name: campus-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # Docker 内用服务名代替 localhost
      - DB_HOST=mysql
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  rabbitmq_data:
